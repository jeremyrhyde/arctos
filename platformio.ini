; Arctos component test bench.
;
; Each test lives in tests/<name>/ and gets one env per board it can run on:
;   pio run -e <name>_nano -t upload      (current gripper node: Arduino Nano + MCP2515)
;   pio run -e <name>_esp32 -t upload     (planned gripper node: ESP32 + SN65HVD230)
; Pins, IDs and limits live in config/config_<node>.yaml; every build regenerates
; lib/arctos_board/<node>_config.h from them (scripts/gen_config.py).

[platformio]
src_dir = tests
default_envs = gripper_servo_nano

; ---- Shared by every env ----

[env]
extra_scripts = pre:scripts/gen_config.py

; ---- Board bases ----

[nano]
platform = atmelavr
; This Nano has the new (115200 baud) bootloader. If upload fails with "not in sync",
; switch to the old-bootloader board: board = nanoatmega328
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; ---- Tests ----

[env:gripper_servo_nano]
extends = nano
build_src_filter = +<gripper_servo/>
lib_deps = arduino-libraries/Servo

[env:gripper_servo_esp32]
extends = esp32
build_src_filter = +<gripper_servo/>
lib_deps = madhephaestus/ESP32Servo
